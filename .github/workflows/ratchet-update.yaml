name: Ratchet Update

on:
  schedule:
    - cron: '17 5 18 * *' # 05:17 UTC on the 18th of every month
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Update pinned actions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.KUADRANT_DEV_PAT }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # ratchet:actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make ratchet-update-all
      - name: Create pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # ratchet:peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(ci): update pinned GitHub Actions to latest SHAs"
          committer: kuadrant-dev <kuadrant-dev@redhat.com>
          author: kuadrant-dev <kuadrant-dev@redhat.com>
          token: ${{ secrets.KUADRANT_DEV_PAT }}
          signoff: true
          sign-commits: true
          base: main
          branch: chore/ratchet-update
          delete-branch: true
          title: "chore(ci): update pinned GitHub Actions to latest SHAs"
          body: |
            Automated monthly update of pinned GitHub Actions references.

            Auto-generated by [ratchet-update](https://github.com/kuadrant/dns-operator/actions/workflows/ratchet-update.yaml)
          labels: dependencies
