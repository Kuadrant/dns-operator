name: Test Runner Configuration

on:
  push:
    branches:
      - gh-runner-test
  workflow_dispatch:

jobs:
  lint-ubuntu-latest:
    name: Lint - ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Show runner specs
        run: |
          echo "=== ubuntu-latest ==="
          nproc
          free -h
          df -h /
      - name: Run lint
        run: make lint

  unit-tests-ubuntu-latest:
    name: Unit Tests - ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Show runner specs
        run: |
          echo "=== ubuntu-latest ==="
          nproc
          free -h
          df -h /
      - name: Run unit tests
        run: make test-unit

  lint-ubuntu-24-04:
    name: Lint - ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Show runner specs
        run: |
          echo "=== ubuntu-24.04 ==="
          nproc
          free -h
          df -h /
      - name: Run lint
        run: make lint

  unit-tests-ubuntu-24-04:
    name: Unit Tests - ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Show runner specs
        run: |
          echo "=== ubuntu-24.04 ==="
          nproc
          free -h
          df -h /
      - name: Run unit tests
        run: make test-unit

  lint-cncf:
    name: Lint - CNCF Group
    runs-on:
      group: Default
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Show runner specs
        run: |
          echo "=== CNCF Group: Default ==="
          nproc
          free -h
          df -h /
      - name: Run lint
        run: make lint

  unit-tests-cncf:
    name: Unit Tests - CNCF Group
    runs-on:
      group: Default
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Show runner specs
        run: |
          echo "=== CNCF Group: Default ==="
          nproc
          free -h
          df -h /
      - name: Run unit tests
        run: make test-unit

  e2e-tests-ubuntu-latest:
    name: E2E Tests - ubuntu-latest
    uses: ./.github/workflows/ci-e2e-0.yaml
    secrets: inherit
    with:
      runsOn: ubuntu-latest
      skipAWS: true
      skipGCP: true
      skipAzure: true

  e2e-tests-ubuntu-24-04:
    name: E2E Tests - ubuntu-24.04
    uses: ./.github/workflows/ci-e2e-0.yaml
    secrets: inherit
    with:
      runsOn: ubuntu-24.04
      skipAWS: true
      skipGCP: true
      skipAzure: true

  e2e-tests-cncf:
    name: E2E Tests - CNCF Group
    uses: ./.github/workflows/ci-e2e-0.yaml
    secrets: inherit
    with:
      runsOn: '{"group": "Default"}'
      skipAWS: true
      skipGCP: true
      skipAzure: true
