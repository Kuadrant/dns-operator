apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: kuadrant
    app.kubernetes.io/name: coredns
  name: kuadrant-coredns
  namespace: kuadrant-coredns
spec:
  ports:
  - name: udp-53
    port: 53
    protocol: UDP
    targetPort: 53
  - name: tcp-53
    port: 53
    protocol: TCP
    targetPort: 53
  selector:
    app.kubernetes.io/instance: kuadrant
    app.kubernetes.io/name: coredns
  type: LoadBalancer
